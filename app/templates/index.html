<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ t.dir }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="lang-switch">
      {% for l in langs %}
        <a href="{{ url_for('index', lang=l) }}" class="{{ 'active' if l == lang else '' }}">
          {{ {'fr':'Français','en':'English','ar':'العربية'}[l] }}
        </a>
      {% endfor %}
    </div>

    <h1>{{ t.title }}</h1>
    <p class="subtitle">{{ t.subtitle }}</p>
    <a class="back-link" href="{{ url_for('settings_route', lang=lang) }}" style="margin-bottom:16px; display:inline-block;">{{ t.settings_link }}</a>

    <div class="panel">
      <div class="tabs">
        <button type="button" class="tab-btn active" onclick="showTab('pdf')">{{ t.tab_pdf }}</button>
        <button type="button" class="tab-btn" onclick="showTab('url')">{{ t.tab_url }}</button>
      </div>

      <div id="tab-pdf" class="tab-content active">
        <form action="{{ url_for('analyze_pdf_route') }}" method="post" enctype="multipart/form-data">
          <input type="hidden" name="lang" value="{{ lang }}">
          <label>{{ t.choose_file }}</label>
          <input type="file" name="pdf_file" accept="application/pdf" required>
          <button type="submit" class="submit">{{ t.analyze_btn }}</button>
        </form>
      </div>

      <div id="tab-url" class="tab-content">
        <form action="{{ url_for('analyze_url_route') }}" method="post">
          <input type="hidden" name="lang" value="{{ lang }}">
          <label>{{ t.enter_url }}</label>
          <input type="text" name="url" placeholder="https://..." required>
          <button type="submit" class="submit">{{ t.analyze_btn }}</button>
        </form>
      </div>
    </div>

    <p class="disclaimer">{{ t.disclaimer }}</p>
  </div>

  <script>
    function showTab(name) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
